<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Settings — AI Capstone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/settings.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>

    <main class="page">
      <header class="intro">
        <p class="brand">AI Capstone</p>
        <h1>Settings</h1>
        <p class="lede">Update your profile and contact information below.</p>
      </header>

      <form id="settings-form" class="settings-form" novalidate aria-labelledby="settings-heading">
        <h2 id="settings-heading" class="visually-hidden">Account Settings Form</h2>

        <!-- Full Name Field -->
        <div class="field" data-field="fullName">
          <label for="fullName">Full Name</label>
          <input
            id="fullName"
            name="fullName"
            type="text"
            autocomplete="name"
            placeholder="e.g. Alex Morgan"
            required
            aria-required="true"
            aria-describedby="fullName-error"
          />
          <p id="fullName-error" class="error" role="alert" aria-live="polite" hidden></p>
        </div>

        <!-- Email Field -->
        <div class="field" data-field="email">
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            placeholder="e.g. alex@example.com"
            required
            aria-required="true"
            aria-describedby="email-error"
          />
          <p id="email-error" class="error" role="alert" aria-live="polite" hidden></p>
        </div>

        <!-- Phone Number Field -->
        <div class="field" data-field="phone">
          <label for="phone">Phone Number</label>
          <input
            id="phone"
            name="phone"
            type="tel"
            autocomplete="tel"
            inputmode="numeric"
            placeholder="e.g. 5551234567 or (555) 123-4567"
            required
            aria-required="true"
            aria-describedby="phone-error"
          />
          <p id="phone-error" class="error" role="alert" aria-live="polite" hidden></p>
        </div>

        <!-- Form Actions and Status -->
        <div class="actions">
          <button type="submit" class="btn-primary" id="submit-btn">Save Settings</button>
          <div id="form-status" class="status" role="status" aria-live="polite"></div>
        </div>
      </form>
    </main>

    <script src="/js/settings.js"></script>
  </body>
</html>
